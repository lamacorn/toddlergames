<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Little Zoo Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#BDE8FF; --sky2:#FFF1E2;
  --hillB1:#D6F3BE; --hillB2:#C3EBA6;
  --hill1:#B4E696; --hill2:#97D77C;
  --grass:#CDEFAE; --grass2:#AEDF90;
  --wood:#F8D7AE; --woodEdge:#DDA36C;
  --cloud:#FFFFFF;
  --ink:#4A3B52;
  --btn:rgba(255,255,255,.72); --btnInk:#6B5577;
  --outline:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#3D4483; --sky2:#9B79A8;
    --hillB1:#6FA97C; --hillB2:#5E966C;
    --hill1:#6CB07A; --hill2:#579A66;
    --grass:#A6DB8E; --grass2:#86C670;
    --wood:#E9C394; --woodEdge:#B9834F;
    --cloud:#C9C3EE;
    --ink:#2E2433;
    --btn:rgba(255,255,255,.55); --btnInk:#3E2F48;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --sky1:#3D4483; --sky2:#9B79A8;
  --hillB1:#6FA97C; --hillB2:#5E966C;
  --hill1:#6CB07A; --hill2:#579A66;
  --grass:#A6DB8E; --grass2:#86C670;
  --wood:#E9C394; --woodEdge:#B9834F;
  --cloud:#C9C3EE;
  --ink:#2E2433;
  --btn:rgba(255,255,255,.55); --btnInk:#3E2F48;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{height:100%;background:linear-gradient(180deg,var(--sky1) 50%,var(--hill2) 50%);overflow:hidden}
body{
  height:100%;margin:0;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%);
  font-family:"Fredoka","Baloo 2","Arial Rounded MT Bold","Varela Round",ui-rounded,system-ui,sans-serif;
  color:var(--ink);
  touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
#app{
  position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;
  --pw:min(43vw,30vh,250px);
  --asz:min(21vw,10.5vh,96px);
}

/* ---------- scenery ---------- */
.cloud{position:absolute;height:28px;background:var(--cloud);border-radius:30px;opacity:.85;z-index:0;animation:drift linear infinite;pointer-events:none}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:42%;aspect-ratio:1;left:16%;bottom:40%}
.cloud::after{width:32%;aspect-ratio:1;left:48%;bottom:30%}
.c1{width:96px;top:4%;animation-duration:80s;animation-delay:-18s}
.c2{width:70px;top:13%;animation-duration:64s;animation-delay:-45s;opacity:.7}
.c3{width:120px;top:22%;animation-duration:95s;animation-delay:-70s;opacity:.6}
@keyframes drift{from{left:-140px}to{left:105%}}
#backhill{position:absolute;left:-25%;right:-25%;top:var(--horizon,32%);bottom:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,var(--hillB1),var(--hillB2));border-radius:50% 50% 0 0/60px 60px 0 0}

/* ---------- mute ---------- */
#mute{position:absolute;top:8px;right:8px;z-index:70;width:44px;height:44px;border-radius:50%;border:0;padding:0;
  background:var(--btn);color:var(--btnInk);display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(70,50,90,.12);cursor:pointer}
#mute:focus-visible{outline:3px solid #fff;outline-offset:2px}
#mute svg{width:24px;height:24px}

/* ---------- pens ---------- */
#pens{position:relative;z-index:2;display:flex;justify-content:center;gap:5vw;padding:6px 4vw 0;flex:0 0 auto}
.pen{width:var(--pw);display:flex;flex-direction:column;align-items:center;--c:#FF6F91}
.num{height:calc(var(--pw)*.5);display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:3;margin-bottom:-2px}
.num span{
  display:inline-block;font-size:calc(var(--pw)*.56);line-height:.9;font-weight:700;color:var(--c);
  text-shadow:4px 0 0 var(--outline),-4px 0 0 var(--outline),0 4px 0 var(--outline),0 -4px 0 var(--outline),
    3px 3px 0 var(--outline),-3px -3px 0 var(--outline),3px -3px 0 var(--outline),-3px 3px 0 var(--outline),
    0 9px 0 rgba(70,50,90,.14);
  animation:numFloat 2.6s ease-in-out infinite;
}
.pen.enter .num{animation:numIn .7s cubic-bezier(.34,1.56,.64,1) both}
.pen.done .num{animation:numCheer .55s ease-in-out 3}
.yard{position:relative;width:100%;aspect-ratio:1/1}
.pen.enter .yard{animation:yardIn .55s cubic-bezier(.34,1.56,.64,1) both}
.yardbg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 0 rgba(60,100,40,.13))}
.yardbg .ground{fill:var(--grass);stroke:var(--grass2);stroke-width:1.4}
.yardbg .patch{fill:var(--grass2);opacity:.45}
.yardbg .tuft{fill:none;stroke:var(--grass2);stroke-width:1.3;stroke-linecap:round}
.yardbg .wood{fill:var(--wood);stroke:var(--woodEdge);stroke-width:.8}
.pen.done .yard::after{content:"";position:absolute;inset:5% 1% 2%;border-radius:18%;pointer-events:none;
  box-shadow:0 0 0 5px rgba(255,255,255,.9),0 0 30px 8px var(--c);animation:glow 1.2s ease-out forwards}
.slots{position:absolute;inset:0}
.slot{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.34);
  animation:breathe 1.8s ease-in-out infinite;z-index:1}
.slot::before{content:"";position:absolute;inset:0;border-radius:50%;border:3.5px dashed rgba(255,255,255,.97);animation:spin 14s linear infinite}
.pen.enter .slot{animation:slotIn .45s cubic-bezier(.34,1.56,.64,1) var(--sd,0s) backwards,breathe 1.8s ease-in-out calc(var(--sd,0s) + .45s) infinite}
.slot.near{animation:none;transform:translate(-50%,-50%) scale(1.18);background:rgba(255,255,255,.7);transition:transform .15s}
.slot.hint{animation:hintGlow .55s ease-in-out 3}
.slot.filled{animation:none;background:transparent}
.slot.filled::before{opacity:0}
.slot.filled::after{content:"";position:absolute;left:14%;right:14%;bottom:-5%;height:16%;border-radius:50%;background:rgba(40,80,20,.16)}
.cpop{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:calc(var(--pw)*.22);color:var(--c);z-index:6;pointer-events:none;
  text-shadow:3px 0 0 #fff,-3px 0 0 #fff,0 3px 0 #fff,0 -3px 0 #fff,2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;
  animation:cpop 1s ease-out forwards}

/* ---------- meadow ---------- */
#meadow{position:relative;z-index:3;flex:1 1 auto;margin-top:calc(var(--pw)*.07)}
#meadow::before{content:"";position:absolute;left:-15%;right:-15%;top:0;bottom:-60px;
  background:linear-gradient(180deg,var(--hill1),var(--hill2));border-radius:50% 50% 0 0/70px 70px 0 0}
.mflower{position:absolute;pointer-events:none;opacity:.9}
#field{position:absolute;left:3vw;right:3vw;top:5%;bottom:2%}
.probe{position:absolute;width:var(--asz);height:1px;visibility:hidden;pointer-events:none}

/* ---------- animals ---------- */
.animal{position:absolute;left:0;top:0;width:var(--asz);height:var(--asz);will-change:transform;z-index:2;cursor:grab;--fx:1}
.animal::before{content:"";position:absolute;inset:-14%}
.animal::after{content:"";position:absolute;left:20%;right:20%;bottom:-3%;height:10%;border-radius:50%;background:rgba(40,80,20,.2);z-index:-1;transition:transform .2s,opacity .2s}
.bob{position:relative;width:100%;height:100%;transform-origin:50% 95%;animation:bob 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.face{width:100%;height:100%;transform:scaleX(var(--fx));transition:transform .35s}
.face svg{width:100%;height:100%;display:block;overflow:visible}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite;animation-delay:var(--bd,0s)}
#dragLayer{position:fixed;inset:0;z-index:40;pointer-events:none}
.dragging{cursor:grabbing}
.dragging::after{transform:translateY(16px) scale(.75);opacity:.55}
.slot > .animal{left:-9%;top:-13%;width:118%;height:118%;cursor:default}
.slot > .animal::after{display:none}
.placed .bob{animation:sway 2.2s ease-in-out infinite;animation-delay:var(--d,0s)}
.walking .bob{animation:waddle .5s ease-in-out infinite}
.dragging .bob{animation:dangle .45s ease-in-out infinite alternate;transform-origin:50% 25%}
.landed .bob{animation:land .5s ease-out}
.cheer .bob{animation:jump .45s ease-in-out 3}
.dance .bob{animation:dance .42s ease-in-out infinite alternate}
.hint .bob{animation:hop .4s ease-in-out 3}
.enter .bob{animation:popIn .55s cubic-bezier(.34,1.56,.64,1) var(--ed,0s) both}
.bye .bob{animation:popOut .38s ease-in forwards}

/* ---------- overlays ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:55}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:60}
.overlay .wrap{display:flex;flex-direction:column;align-items:center;opacity:0}
#big{--c:#FF6F91}
#big.show .wrap{animation:bigPop 1.5s cubic-bezier(.34,1.4,.64,1) forwards}
.bigNum{font-size:min(62vw,44vh);line-height:.85;font-weight:700;color:var(--c);
  text-shadow:7px 0 0 #fff,-7px 0 0 #fff,0 7px 0 #fff,0 -7px 0 #fff,5px 5px 0 #fff,-5px -5px 0 #fff,5px -5px 0 #fff,-5px 5px 0 #fff,0 16px 0 rgba(70,50,90,.18)}
.bigDots{display:flex;gap:2.5vw;margin-top:2vh}
.bigDots svg{width:min(12vw,7vh);height:min(12vw,7vh);overflow:visible;animation:starIn .4s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i)*.1s + .2s)}
#win.show .wrap{animation:winPop 3s ease-out forwards}
.yay{font-size:min(30vw,19vh);font-weight:700;line-height:1;white-space:nowrap}
.yay span{display:inline-block;color:var(--c);animation:letter .5s ease-in-out infinite alternate;animation-delay:calc(var(--i)*.12s);
  text-shadow:6px 0 0 #fff,-6px 0 0 #fff,0 6px 0 #fff,0 -6px 0 #fff,4px 4px 0 #fff,-4px -4px 0 #fff,4px -4px 0 #fff,-4px 4px 0 #fff,0 14px 0 rgba(70,50,90,.18)}
.winStars{display:flex;gap:4vw;margin-top:1vh}
.winStars svg{width:min(14vw,8vh);height:min(14vw,8vh);overflow:visible;animation:twirl 1.2s ease-in-out infinite;animation-delay:calc(var(--i)*.15s)}

/* ---------- keyframes ---------- */
@keyframes bob{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-6%) scale(.98,1.02)}}
@keyframes waddle{0%,100%{transform:rotate(-6deg) translateY(0)}25%{transform:rotate(0) translateY(-8%)}50%{transform:rotate(6deg) translateY(0)}75%{transform:rotate(0) translateY(-8%)}}
@keyframes dangle{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes land{0%{transform:scale(1.25,.72)}35%{transform:translateY(-10%) scale(.9,1.14)}65%{transform:scale(1.06,.94)}100%{transform:scale(1)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3%)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.05,.95)}45%{transform:translateY(-24%) scale(.95,1.06)}}
@keyframes dance{from{transform:rotate(-11deg) translateY(0)}to{transform:rotate(11deg) translateY(-14%)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-20%) rotate(4deg)}}
@keyframes popIn{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes popOut{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(0) rotate(20deg);opacity:0}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slotIn{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
@keyframes hintGlow{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.22);background:rgba(255,255,255,.85);box-shadow:0 0 20px 4px #fff}}
@keyframes numFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6%) rotate(3deg)}}
@keyframes numIn{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1)}}
@keyframes numCheer{0%,100%{transform:scale(1)}50%{transform:scale(1.3) rotate(8deg)}}
@keyframes yardIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes glow{0%{opacity:0;transform:scale(.9)}30%{opacity:1;transform:scale(1.04)}100%{opacity:.6;transform:scale(1)}}
@keyframes cpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}25%{opacity:1;transform:translate(-50%,-95%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
@keyframes bigPop{0%{opacity:0;transform:scale(.2) rotate(-12deg)}20%{opacity:1;transform:scale(1.1) rotate(4deg)}32%{transform:scale(1) rotate(0)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1)}}
@keyframes winPop{0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
@keyframes letter{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-12%) rotate(6deg)}}
@keyframes twirl{0%,100%{transform:rotate(-15deg) scale(1)}50%{transform:rotate(15deg) scale(1.2)}}

@media (prefers-reduced-motion: reduce){
  .cloud{animation:none}
  .slot::before{animation:none}
  .bob,.placed .bob{animation-duration:3.2s}
}
</style>
</head>
<body>
<div id="app">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div id="backhill"></div>
  <button id="mute" type="button" aria-label="Sound on"></button>
  <div id="pens">
    <div class="pen"><div class="num"><span></span></div><div class="yard"><div class="slots"></div></div></div>
    <div class="pen"><div class="num"><span></span></div><div class="yard"><div class="slots"></div></div></div>
  </div>
  <div id="meadow"><div id="field"></div></div>
  <div class="probe"></div>
</div>
<div id="dragLayer"></div>
<canvas id="fx"></canvas>
<div id="big" class="overlay"><div class="wrap"><div class="bigNum"></div><div class="bigDots"></div></div></div>
<div id="win" class="overlay"><div class="wrap">
  <div class="yay"><span style="--i:0;--c:#FF6F91">Y</span><span style="--i:1;--c:#FF9A3C">a</span><span style="--i:2;--c:#4CC173">y</span><span style="--i:3;--c:#4D9DF5">!</span></div>
  <div class="winStars"></div>
</div></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const app = $('#app'), field = $('#field'), meadow = $('#meadow'), dragLayer = $('#dragLayer');
const muteBtn = $('#mute'), probe = $('.probe');

const rnd = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const shuffle = arr => { for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };

const COLORS = {1:'#FF6F91',2:'#FF9A3C',3:'#F2B705',4:'#4CC173',5:'#4D9DF5'};
const WORDS = ['zero','one','two','three','four','five'];
const LAYOUT = {
  1:{s:.5,  p:[[.5,.52]]},
  2:{s:.42, p:[[.27,.52],[.73,.52]]},
  3:{s:.38, p:[[.28,.32],[.72,.32],[.5,.73]]},
  4:{s:.37, p:[[.28,.31],[.72,.31],[.28,.73],[.72,.73]]},
  5:{s:.33, p:[[.24,.27],[.76,.27],[.5,.52],[.24,.77],[.76,.77]]}
};

/* ================= ANIMAL ART ================= */
const INK = '#3B2F3F';
const f2 = n => n.toFixed(2);
const eye = (x,y,r) => `<g class="eye"><ellipse cx="${x}" cy="${y}" rx="${r}" ry="${f2(r*1.15)}" fill="${INK}"/><circle cx="${f2(x+r*.32)}" cy="${f2(y-r*.42)}" r="${f2(r*.42)}" fill="#fff"/><circle cx="${f2(x-r*.36)}" cy="${f2(y+r*.45)}" r="${f2(r*.18)}" fill="#fff"/></g>`;
const eyes = (x1,x2,y,r=4.5) => eye(x1,y,r) + eye(x2,y,r);
const blush = (x1,x2,y) => `<ellipse cx="${x1}" cy="${y}" rx="5.5" ry="3.3" fill="#FF8FA8" opacity=".55"/><ellipse cx="${x2}" cy="${y}" rx="5.5" ry="3.3" fill="#FF8FA8" opacity=".55"/>`;
const smile = (x,y,w=4) => `<path d="M${x-w} ${y} Q${x} ${y+w} ${x+w} ${y}" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`;
const feet = (c,st='') => `<ellipse cx="38" cy="94" rx="8.5" ry="5" fill="${c}" ${st}/><ellipse cx="62" cy="94" rx="8.5" ry="5" fill="${c}" ${st}/>`;
const body = (c,b,st='') => `<ellipse cx="50" cy="80" rx="23" ry="16" fill="${c}" ${st}/>` + (b ? `<ellipse cx="50" cy="83" rx="13" ry="10" fill="${b}"/>` : '');
const arms = (c,st='') => `<ellipse cx="29" cy="79" rx="6" ry="9" transform="rotate(25 29 79)" fill="${c}" ${st}/><ellipse cx="71" cy="79" rx="6" ry="9" transform="rotate(-25 71 79)" fill="${c}" ${st}/>`;

const ART = {
  elephant(){
    const c='#A9C1EE', d='#8DA6DC', p='#F8C3D5';
    const trunk='M50 53 Q50 67 57 71 Q63 73 63 66';
    return feet(d) + body(c,'#C9D8F5') + arms(c) +
      `<ellipse cx="21" cy="43" rx="16" ry="19" fill="${c}"/><ellipse cx="22" cy="44" rx="10" ry="13" fill="${p}"/>
       <ellipse cx="79" cy="43" rx="16" ry="19" fill="${c}"/><ellipse cx="78" cy="44" rx="10" ry="13" fill="${p}"/>
       <path d="${trunk}" fill="none" stroke="${d}" stroke-width="11.5" stroke-linecap="round"/>
       <circle cx="50" cy="43" r="25" fill="${c}"/>
       <path d="${trunk}" fill="none" stroke="${c}" stroke-width="8.5" stroke-linecap="round"/>
       <path d="M46 20 Q48 13 50 19 Q52 13 54 19" fill="none" stroke="${d}" stroke-width="2.4" stroke-linecap="round"/>` +
      eyes(40,60,41) + blush(31,69,51);
  },
  panda(){
    const k='#3E3A48';
    return feet(k) + body(k,'#FFFFFF') + arms(k) +
      `<circle cx="29" cy="24" r="9" fill="${k}"/><circle cx="71" cy="24" r="9" fill="${k}"/>
       <circle cx="50" cy="45" r="26" fill="#fff" stroke="#E6DCE8" stroke-width="1.5"/>
       <ellipse cx="39.5" cy="44" rx="7.5" ry="10" transform="rotate(28 39.5 44)" fill="${k}"/>
       <ellipse cx="60.5" cy="44" rx="7.5" ry="10" transform="rotate(-28 60.5 44)" fill="${k}"/>
       <g class="eye"><circle cx="40.5" cy="43" r="3.7" fill="#fff"/><circle cx="41" cy="43.7" r="2.2" fill="${k}"/></g>
       <g class="eye"><circle cx="59.5" cy="43" r="3.7" fill="#fff"/><circle cx="59" cy="43.7" r="2.2" fill="${k}"/></g>
       <ellipse cx="50" cy="54" rx="4" ry="2.8" fill="${k}"/>
       <path d="M45.5 58 Q47.8 61 50 58 Q52.2 61 54.5 58" fill="none" stroke="${k}" stroke-width="2" stroke-linecap="round"/>` +
      blush(31,69,55);
  },
  lion(){
    const c='#FFD47E', m='#F49A4A', m2='#F8B25F';
    let mane='';
    for (let i=0;i<12;i++){ const a=i/12*Math.PI*2; mane += `<circle cx="${f2(50+Math.cos(a)*24)}" cy="${f2(45+Math.sin(a)*24)}" r="10.5" fill="${i%2?m:m2}"/>`; }
    return `<path d="M70 86 Q86 88 86 74" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/><circle cx="86" cy="72" r="5" fill="${m}"/>` +
      feet('#F2BC62') + body(c,'#FFF0CC') + arms(c) +
      `<circle cx="50" cy="45" r="26" fill="${m}"/>` + mane +
      `<circle cx="33" cy="29" r="7" fill="${c}"/><circle cx="33" cy="29" r="3.5" fill="#F7B6A0"/>
       <circle cx="67" cy="29" r="7" fill="${c}"/><circle cx="67" cy="29" r="3.5" fill="#F7B6A0"/>
       <circle cx="50" cy="47" r="21" fill="${c}"/>
       <ellipse cx="45.5" cy="56.5" rx="6.5" ry="5" fill="#FFF3D9"/><ellipse cx="54.5" cy="56.5" rx="6.5" ry="5" fill="#FFF3D9"/>

let muted = false;
try { muted = localStorage.getItem('lzn-muted') === '1'; } catch(e) {}
let ac = null, master = null, unlocked = false, speechReady = false;
function unlock(){
  try {
    if (!ac){
      const C = window.AudioContext || window.webkitAudioContext;
      if (C){ ac = new C(); master = ac.createGain(); master.gain.value = muted ? 0 : .7; master.connect(ac.destination); }
    }
    if (ac && ac.state !== 'running') ac.resume();
    if (ac) unlocked = true;
  } catch(e) {}
  if (!speechReady && 'speechSynthesis' in window){
    speechReady = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch(e) {}
  }
}
['touchend','click','pointerup'].forEach(ev => document.addEventListener(ev, unlock, {passive:true}));

function tone(f, d, {to=null, type='sine', v=.2, t=0} = {}){
  if (muted || !ac || !unlocked) return;
  try {
    const t0 = ac.currentTime + t + .01;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + .05);
  } catch(e) {}
}
const NOTES = [0, 523.25, 587.33, 659.25, 783.99, 880];
const sfx = {

  place(n){ tone(NOTES[n],.32,{type:'triangle',v:.28}); tone(NOTES[n]*2,.18,{v:.07,t:.02}); tone(220,.09,{to:90,v:.22}); },
  boing(){ tone(380,.28,{to:190,v:.16}); tone(190,.18,{to:300,v:.08,t:.15}); },
  settle(){ tone(330,.12,{to:250,v:.12}); },
  success(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.3,{type:'triangle',v:.22,t:.15+i*.09})); tone(1568,.4,{v:.06,t:.55}); tone(2093,.4,{v:.05,t:.63}); },

      .forEach(([f,t,d]) => { tone(f,d+.05,{type:'triangle',v:.22,t}); tone(f/2,d+.05,{v:.1,t}); });
    for (let i=0;i<9;i++) tone(rnd(1500,2600),.15,{v:.04,t:1.15+i*.07});
  },
  appear(i){ tone(600+i*40,.1,{to:900+i*40,v:.08}); },
  bye(){ tone(700,.15,{to:350,v:.08}); }
};

let voice = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices();
    const pref = ['Samantha','Karen','Moira','Tessa','Google US English'];
    voice = pref.map(n => vs.find(v => v.name.includes(n))).find(Boolean)
      || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch(e) {}
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, {pitch=1.35, rate=.92} = {}){
  if (muted || !('speechSynthesis' in window)) return;
  try {
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : 'en-US';
    u.pitch = pitch; u.rate = rate; u.volume = 1;
    speechSynthesis.speak(u);
  } catch(e) {}
}

const cv = $('#fx'), cx = cv.getContext('2d');
let P = [], raf = 0;
const CC = ['#FF6F91','#FF9A3C','#FFD23F','#4CC173','#4D9DF5','#B983FF','#FF9CEE','#7AE0E6'];
function sizeFx(){ const dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; cx.setTransform(dpr,0,0,dpr,0,0); }
function addP(x,y,vx,vy,life){ P.push({x,y,vx,vy,r:rnd(0,6.28),vr:rnd(-.25,.25),s:rnd(7,13),c:CC[ri(0,CC.length-1)],k:ri(0,2),t:0,life,w:rnd(0,6.28)}); }
function burst(x,y,n){ for (let i=0;i<n;i++){ const a=rnd(-Math.PI*.95,-Math.PI*.05), sp=rnd(4,12); addP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,rnd(70,120)); } run(); }
function rain(n){ for (let i=0;i<n;i++) addP(rnd(0,innerWidth), rnd(-innerHeight*.6,-10), rnd(-1,1), rnd(2,5), rnd(170,240)); run(); }
function run(){ if (!raf) raf = requestAnimationFrame(step); }
const SP = new Path2D(starPath(1,.45));
function step(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  P = P.filter(p => p.t < p.life && p.y < innerHeight + 40);
  for (const p of P){
    p.t++; p.vy = Math.min(p.vy + .22, 5.5); p.vx *= .985;
    p.x += p.vx + Math.sin(p.t*.1 + p.w)*.7; p.y += p.vy; p.r += p.vr;
    cx.globalAlpha = Math.min(1, (p.life - p.t)/25);
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    if (p.k === 0){ cx.scale(1, Math.cos(p.t*.15)); cx.fillRect(-p.s/2,-p.s*.3,p.s,p.s*.6); }
    else if (p.k === 1){ cx.beginPath(); cx.arc(0,0,p.s*.38,0,Math.PI*2); cx.fill(); }
    else { cx.scale(p.s*.7,p.s*.7); cx.fill(SP); }
    cx.restore();
  }
  cx.globalAlpha = 1;
  raf = P.length ? requestAnimationFrame(step) : 0;
  if (!P.length) cx.clearRect(0,0,innerWidth,innerHeight);
}

function computeHomes(n){
  const s = aszPx(), W = Math.max(field.clientWidth, s), H = Math.max(field.clientHeight, s);
  const cols = Math.max(2, Math.floor(W/(s*1.08))), rows = Math.max(1, Math.floor(H/(s*1.05)));
  const cells = [];
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) cells.push([c,r]);
  shuffle(cells);
  const cw = W/cols, ch = H/rows, out = [];
  for (let i=0;i<n;i++){
    const [c,r] = cells[i % cells.length];
    const jx = Math.max(0,(cw-s)/2)*.8, jy = Math.max(0,(ch-s)/2)*.8;
    const x = clamp(c*cw + (cw-s)/2 + rnd(-jx,jx), 0, W-s);
    const y = clamp(r*ch + (ch-s)/2 + rnd(-jy,jy), 0, H-s);
    out.push({x,y});
  }
  return out;
}

function setupPen(p, n){

function spawnAnimals(n){
  const sp = shuffle(SPECIES.slice());
  const homes = computeHomes(n);
  for (let i=0;i<n;i++){
    const s = sp[i % sp.length];
    const el = document.createElement('div');
    el.className = 'animal enter';
    el.innerHTML = `<div class="bob"><div class="face">${svgFor(s)}</div></div>`;
    const ed = .35 + i*.08;
    el.style.setProperty('--d', (-Math.random()*1.6).toFixed(2) + 's');
    el.style.setProperty('--bd', (Math.random()*4.5).toFixed(2) + 's');
    el.style.setProperty('--ed', ed.toFixed(2) + 's');
    el.style.setProperty('--fx', Math.random() < .5 ? 1 : -1);
    const a = { el, species: s, x: homes[i].x, y: homes[i].y, hx: homes[i].x, hy: homes[i].y, state: 'meadow' };
    el._a = a;
    setPos(el, a.x, a.y);
    field.appendChild(el);
    state.animals.push(a);
    setTimeout(() => sfx.appear(i), ed*1000);
    setTimeout(() => el.classList.remove('enter'), ed*1000 + 600);
    a.t = setTimeout(() => wander(a), ed*1000 + rnd(1200,3500));
  }
}

function startRound(){
  const a = ri(1,5); let b; do { b = ri(1,5); } while (b === a);
  setupPen(pens[0], a); setupPen(pens[1], b);
  spawnAnimals(a + b);
  state.celebrating = false;
  lastAct = Date.now();
}

function endRound(){

  pens.forEach(p => p.el.classList.remove('done'));

/* ================= WANDERING ================= */
function scheduleWander(a){ clearTimeout(a.t); a.t = setTimeout(() => wander(a), rnd(1500,4500)); }
function wander(a){
  if (a.state !== 'meadow') return;
  const s = aszPx(), W = field.clientWidth, H = field.clientHeight, R = s*.45;
  const nx = clamp(a.hx + rnd(-R,R), 0, Math.max(0,W-s));
  const ny = clamp(a.hy + rnd(-R*.6,R*.6), 0, Math.max(0,H-s));
  const dx = nx - a.x;
  if (Math.abs(dx) > 4) a.el.style.setProperty('--fx', dx < 0 ? -1 : 1);
  const dur = clamp(Math.hypot(dx, ny-a.y)/40, .6, 1.8);
  a.el.style.transition = `transform ${dur}s ease-in-out`;
  a.el.classList.add('walking');
  a.x = nx; a.y = ny; setPos(a.el, nx, ny);
  clearTimeout(a.wt); a.wt = setTimeout(() => a.el.classList.remove('walking'), dur*1000);
  scheduleWander(a);
}

function findTarget(cx_, cy_){
  let best = null, bd = Infinity;
  for (const p of pens){

    const yr = p.yard.getBoundingClientRect(), pad = Math.max(24, yr.width*.15);
    const inYard = cx_ > yr.left-pad && cx_ < yr.right+pad && cy_ > yr.top-pad && cy_ < yr.bottom+pad;
    for (const s of p.slots){
      if (s.filled || s.reserved) continue;
      const r = s.el.getBoundingClientRect();
      const d = Math.hypot(cx_-(r.left+r.width/2), cy_-(r.top+r.height/2));
      if ((inYard || d < Math.max(r.width*1.3, 80)) && d < bd){ bd = d; best = s; }
    }
  }
  return best;
}
function setNear(s){
  if (nearSlot === s) return;
  if (nearSlot) nearSlot.el.classList.remove('near');
  nearSlot = s;
  if (s){ s.el.classList.add('near'); sfx.near(); }
}

function onDown(e){
  if (drag) return;
  let el = e.target.closest ? e.target.closest('.animal') : null;
  let a = el && el._a;
  if (!a || a.state !== 'meadow'){
    // forgiving grab: nearest wandering animal to the touch
    let best = null, bd = aszPx()*.85;
    for (const b of state.animals){
      if (b.state !== 'meadow') continue;
      const r = b.el.getBoundingClientRect();
      const d = Math.hypot(e.clientX-(r.left+r.width/2), e.clientY-(r.top+r.height/2));
      if (d < bd){ bd = d; best = b; }
    }
    a = best;
  }
  if (!a) return;
  e.preventDefault();
  unlock();
  lastAct = Date.now();
  el = a.el;
  clearTimeout(a.t); clearTimeout(a.wt);
  const r = el.getBoundingClientRect();
  a.state = 'drag';
  el.classList.remove('walking','hint','landed','enter');
  el.style.transition = 'none';
  dragLayer.appendChild(el);
  el.style.width = el.style.height = r.width + 'px';
  drag = { a, id: e.pointerId, ox: e.clientX - r.left, oy: e.clientY - r.top, x: r.left, y: r.top, w: r.width };
  setPos(el, r.left, r.top, 1.15);
  void el.offsetWidth;
  el.style.transition = 'transform .12s ease-out';
  el.classList.add('dragging');
  setTimeout(() => { if (drag && drag.a === a) el.style.transition = 'none'; }, 130);
  sfx.pickup();
}

function onMove(e){
  if (!drag || e.pointerId !== drag.id) return;
  e.preventDefault();
  drag.x = e.clientX - drag.ox; drag.y = e.clientY - drag.oy;
  setPos(drag.a.el, drag.x, drag.y, 1.15);
  setNear(findTarget(drag.x + drag.w/2, drag.y + drag.w/2));
}

function onUp(e){
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  const a = d.a, el = a.el;
  const cx_ = d.x + d.w/2, cy_ = d.y + d.w/2;
  setNear(null);
  el.classList.remove('dragging');
  lastAct = Date.now();
  const slot = e.type === 'pointercancel' ? null : findTarget(cx_, cy_);
  if (slot) { placeInto(a, slot); return; }
  const fr = field.getBoundingClientRect(), s = aszPx();
  if (e.type !== 'pointercancel' && cx_ > fr.left && cx_ < fr.right && cy_ > fr.top - 10 && cy_ < fr.bottom + 40){
    // set down in the meadow: it stays where it was dropped
    const nx = clamp(cx_ - fr.left - s/2, 0, Math.max(0, fr.width - s));
    const ny = clamp(cy_ - fr.top - s/2, 0, Math.max(0, fr.height - s));
    a.hx = nx; a.hy = ny;
    sfx.settle();
    returnToField(a, nx, ny, .25, 'ease-out');
  } else {
    sfx.boing();
    returnToField(a, a.x, a.y, .5, 'cubic-bezier(.34,1.56,.64,1)');
  }
}

function returnToField(a, x, y, dur, ease){
  const el = a.el, fr = field.getBoundingClientRect(), s = aszPx();
  a.state = 'fly';
  el.style.transition = `transform ${dur}s ${ease}, width ${dur}s, height ${dur}s`;
  el.style.width = el.style.height = s + 'px';
  setPos(el, fr.left + x, fr.top + y, 1);
  setTimeout(() => {
    field.appendChild(el);
    el.style.transition = 'none';
    el.style.width = el.style.height = '';
    a.x = x; a.y = y; setPos(el, x, y);
    a.state = 'meadow';
    el.classList.add('landed');
    setTimeout(() => el.classList.remove('landed'), 500);
    scheduleWander(a);
  }, dur*1000 + 20);
}

function placeInto(a, slot){
  const el = a.el, p = slot.pen;
  slot.reserved = true; a.state = 'fly';
  const sr = slot.el.getBoundingClientRect();
  const tw = sr.width * 1.18;
  const tx = sr.left + sr.width/2 - tw/2, ty = sr.top + sr.height/2 - tw/2 - sr.width*.04;
  el.style.transition = 'transform .22s cubic-bezier(.3,1.3,.6,1), width .22s ease, height .22s ease';
  el.style.width = el.style.height = tw + 'px';
  setPos(el, tx, ty, 1);
  p.count++;
  const n = p.count, complete = n === p.n;
  sfx.place(n);
  if (complete) speak(WORDS[n].charAt(0).toUpperCase() + WORDS[n].slice(1) + '!', {pitch:1.5, rate:.85});
  else speak(WORDS[n]);
  setTimeout(() => {
    slot.el.appendChild(el);
    el.style.transition = 'none'; el.style.transform = ''; el.style.width = el.style.height = '';
    slot.filled = true; slot.el.classList.add('filled');
    a.state = 'placed';
    el.classList.add('placed','landed');
    setTimeout(() => el.classList.remove('landed'), 520);
    countPop(p, slot, n);
    if (complete) completePen(p);
  }, 230);
}

function countPop(p, slot, n){
  const c = document.createElement('div');
  c.className = 'cpop'; c.textContent = n;
  c.style.left = slot.el.style.left;
  c.style.top = `calc(${slot.el.style.top} - ${parseFloat(slot.el.style.height)/2}%)`;
  p.yard.appendChild(c);
  setTimeout(() => c.remove(), 1050);
}

/* ================= CELEBRATIONS ================= */
const big = $('#big'), bigNum = $('.bigNum'), bigDots = $('.bigDots'), win = $('#win');
function showBig(n){
  big.style.setProperty('--c', COLORS[n]);
  bigNum.textContent = n;
  bigDots.innerHTML = Array.from({length:n}, (_,i) => starSVG(COLORS[n], i)).join('');
  big.classList.remove('show'); void big.offsetWidth; big.classList.add('show');
}
function completePen(p){
  p.done = true;
  p.el.classList.add('done');
  const r = p.yard.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height*.4, 80);
  sfx.success();
  showBig(p.n);
  p.slots.forEach(s => { const el = s.el.querySelector('.animal'); if (el){ el.classList.add('cheer'); setTimeout(() => el.classList.remove('cheer'), 1400); } });
  if (pens.every(q => q.done)){ state.celebrating = true; setTimeout(bigWin, 1500); }
}
function bigWin(){
  sfx.fanfare();
  speak('Hooray! Great counting!', {pitch:1.5, rate:.9});
  $('.winStars').innerHTML = ['#FF6F91','#FFD23F','#4CC173','#4D9DF5','#B983FF'].map((c,i) => starSVG(c,i)).join('');
  win.classList.remove('show'); void win.offsetWidth; win.classList.add('show');
  rain(220);
  setTimeout(() => burst(innerWidth*.2, innerHeight*.55, 60), 350);
  setTimeout(() => burst(innerWidth*.8, innerHeight*.55, 60), 700);
  state.animals.forEach(a => a.el.classList.add('dance'));
  setTimeout(endRound, 3300);
}

/* ================= IDLE HINT ================= */
setInterval(() => {
  if (drag || state.celebrating || Date.now() - lastAct < 7000) return;
  lastAct = Date.now();
  const m = state.animals.filter(a => a.state === 'meadow');
  if (!m.length) return;
  const a = m[ri(0, m.length-1)];
  a.el.classList.add('hint'); setTimeout(() => a.el.classList.remove('hint'), 1250);
  const p = pens.find(q => !q.done);
  const s = p && p.slots.find(x => !x.filled && !x.reserved);
  if (s){ s.el.classList.add('hint'); setTimeout(() => s.el.classList.remove('hint'), 1700); }
}, 1000);

/* ================= EVENTS ================= */
meadow.addEventListener('pointerdown', onDown, {passive:false});
window.addEventListener('pointermove', onMove, {passive:false});
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    sizeFx(); updateHorizon();
    const m = state.animals.filter(a => a.state === 'meadow');
    const homes = computeHomes(m.length);
    m.forEach((a,i) => { a.hx = a.x = homes[i].x; a.hy = a.y = homes[i].y; a.el.style.transition = 'none'; setPos(a.el, a.x, a.y); });
  }, 120);
});

/* ================= GO ================= */
setMuted(muted);
sizeFx();
decorateMeadow();
startRound();
requestAnimationFrame(updateHorizon);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateHorizon);
})();
</script>
